<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI CI/CD Azure Lab</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <section class="hero">
      <div class="hero-header">
        <p class="eyebrow">GitHub Actions × Azure</p>
        <button id="login-button" type="button" aria-pressed="false">Login</button>
      </div>
      <h1>AI CI/CD Azure Lab</h1>
      <p>以 HTML、JavaScript 與 C# API 示範從 Pull Request 到雲端部署的流程。</p>
      <output id="login-status" class="login-status" aria-live="polite">尚未登入</output>
    </section>

    <section class="card sentiment-card">
      <div class="sentiment-heading">
        <div>
          <p class="eyebrow">即時 AI 分析</p>
          <h2>用戶評論情感分析</h2>
        </div>
        <span id="sentiment-status" class="sentiment-status">等待輸入</span>
      </div>
      <label for="sentiment-text">輸入評論</label>
      <textarea id="sentiment-text" maxlength="500" rows="4"
        placeholder="例如：這次服務非常好，回覆速度很快！"></textarea>
      <div class="sentiment-meta">
        <span>離開輸入框後自動分析</span>
        <span id="sentiment-count">0 / 500</span>
      </div>
      <div class="gauge" aria-hidden="true">
        <svg viewBox="0 0 200 120" role="img">
          <path class="gauge-track" d="M 20 100 A 80 80 0 0 1 180 100"></path>
          <path class="gauge-zone gauge-negative" d="M 20 100 A 80 80 0 0 1 68 31"></path>
          <path class="gauge-zone gauge-neutral" d="M 68 31 A 80 80 0 0 1 132 31"></path>
          <path class="gauge-zone gauge-positive" d="M 132 31 A 80 80 0 0 1 180 100"></path>
          <line id="sentiment-needle" class="gauge-needle" x1="100" y1="100" x2="100" y2="30"></line>
          <circle class="gauge-hub" cx="100" cy="100" r="7"></circle>
        </svg>
        <div class="gauge-labels"><span>憤怒</span><span>中性</span><span>開心</span></div>
      </div>
      <div class="sentiment-result" aria-live="polite">
        <strong id="sentiment-label">等待輸入</strong>
        <span id="sentiment-score">分數：—</span>
        <span id="sentiment-confidence">信心度：—</span>
      </div>
      <p id="sentiment-summary" class="sentiment-summary">輸入評論並離開輸入框後，這裡會顯示分析摘要。</p>
      <p id="sentiment-error" class="sentiment-error" role="status"></p>
    </section>

    <section class="card">
      <h2>呼叫 C# API</h2>
      <form id="greeting-form">
        <label for="name">你的名字</label>
        <div class="form-row">
          <input id="name" name="name" maxlength="50" placeholder="例如：小明" value="課程學員" required>
        </div>
        <div class="captcha-section">
          <label for="captcha-answer">請輸入圖片中的文字</label>
          <div class="captcha-row">
            <img id="captcha-image" class="captcha-image" alt="圖形驗證碼載入中" width="220" height="72">
            <button id="refresh-captcha" type="button">換一張</button>
            <button type="submit">登入</button>
          </div>
          <input id="captcha-answer" name="captcha-answer" maxlength="5" autocomplete="off" autocapitalize="characters" required>
        </div>
      </form>
      <output id="result" class="result" aria-live="polite">尚未呼叫 API</output>
    </section>
	
    <section class="card">
      <h2>🎲 今日課程任務</h2>
      <p>按下按鈕，看看今天要挑戰什麼！</p>
      <button id="challenge-button" type="button">抽取任務</button>
      <output id="challenge-result" class="result" aria-live="polite">
        還沒有抽取任務
      </output>
    </section>

    <section class="card quote-card">
      <h2>今日小語</h2>
      <p id="daily-quote" class="daily-quote" aria-live="polite">載入中⋯</p>
    </section>

    <section class="card status-card">
      <div>
        <h2>服務狀態</h2>
        <p id="health-status">檢查中⋯</p>
      </div>
      <span id="status-badge" class="badge">CHECKING</span>
    </section>
  </main>
  <script src="api-config.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
