name: .NET CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore tests/AiCicdAzureLab.Api.Tests/AiCicdAzureLab.Api.Tests.csproj --configfile NuGet.Config

      - name: Run tests
        run: dotnet test tests/AiCicdAzureLab.Api.Tests/AiCicdAzureLab.Api.Tests.csproj --configuration Release --no-restore

      - name: Test AI review request
        run: python3 -m unittest discover -s tests -p 'test_ai_review_workflow.py'

      - name: Build Docker image
        run: docker build --tag ai-cicd-azure-lab:$GITHUB_SHA .
